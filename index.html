<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werkbon - Pixia B.V.</title>

<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com"></script>

<style>
:root{
    --pixia-purple:#6a2a8b;
    --field-height:34px;
}

*{box-sizing:border-box;}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:10px;
    color:#333;
}

.page{
    width:210mm;
    margin:auto;
    background:#fff;
    padding:20px 25px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
}

.header{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.logo img{
    max-width:180px;
}

.company-info{
    text-align:right;
    font-size:.8em;
}

h1{
    color:var(--pixia-purple);
    border-bottom:2px solid var(--pixia-purple);
    padding-bottom:5px;
    margin-bottom:15px;
}

.section{margin-bottom:14px;}

label{
    display:block;
    font-size:.75em;
    font-weight:bold;
    text-transform:uppercase;
    color:var(--pixia-purple);
    margin-bottom:4px;
}

input,textarea,.editable{
    width:100%;
    padding:8px 10px;
    border:1px solid #cbd5e0;
    border-radius:4px;
    font-size:14px;
    font-family:inherit;
}

textarea{
    resize:none;
}

.editable{
    min-height:60px;
    white-space:pre-wrap;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:12px;
    flex-wrap:wrap;
}

.approval{
    border:2px solid var(--pixia-purple);
    background:#fcfaff;
    padding:15px;
    border-radius:8px;
    margin-top:10px;
    overflow: hidden; /* Zorgt dat float knop binnen kader blijft */
}

.signature-wrap{
    background:#fff;
    border:1px solid #cbd5e0;
    border-radius:4px;
    margin-top:10px;
}

canvas{
    width:100%;
    height:120px;
    display:block;
    cursor:crosshair;
    touch-action:none;
}

.controls{
    text-align:center;
    margin:20px 0;
    display:flex;
    justify-content:center;
    gap:10px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.print-btn{background:#4a5568;color:#fff;}
.pdf-btn{background:var(--pixia-purple);color:#fff;}
.clear-btn{
    float:right;
    font-size:.7em;
    padding:4px 8px;
    background:#edf2f7;
    border:1px solid #cbd5e0;
}

@media print{
    body{background:#fff;padding:0;}
    .controls,.clear-btn{display:none!important;}
    .page{box-shadow:none;width:100%;padding:10mm;}
}
</style>
</head>
<body>

<div class="page" id="work-order">

<div class="header">
    <div class="logo">
        <img src="https://www.sign.nl" alt="Pixia Logo">
    </div>
    <div class="company-info">
        <strong>Pixia B.V.</strong><br>
        De Limiet 19, 4131 NR Vianen<br>
        +31 (0) 30 – 303 99 00
    </div>
</div>

<h1>WERKBON</h1>

<div class="section">
<label>Klantgegevens</label>
<textarea rows="5" placeholder="Naam
Adres
Postcode & Woonplaats
Contactpersoon
Telefoonnummer"></textarea>
</div>

<div class="section">
<label>E-mailadres klant</label>
<input type="email" required placeholder="klant@voorbeeld.nl">
</div>

<div class="row">
<div>
<label>Datum van</label>
<input type="date" id="date-from">
</div>
<div>
<label>Datum tot</label>
<input type="date">
</div>
<div>
<label>Gewerkte uren</label>
<input type="number" step="0.25" min="0">
</div>
</div>

<div class="section">
<label>Omschrijving werkzaamheden</label>
<div class="editable" contenteditable="true"></div>
</div>

<div class="section">
<label>Materialen / Overige kosten</label>
<div class="editable" contenteditable="true"></div>
</div>

<div class="section">
<label>Opmerkingen</label>
<div class="editable" contenteditable="true"></div>
</div>

<div class="approval">
<button class="clear-btn" id="clear-signature">Wissen</button>

<label>Goedkeuring klant</label>
<p style="font-size:.75em;">Klant gaat akkoord met de werkzaamheden.</p>

<div class="row">
<div>
<label>Plaats</label>
<input type="text">
</div>
<div>
<label>Datum</label>
<input type="date">
</div>
</div>

<div class="signature-wrap">
<canvas id="signature-pad"></canvas>
</div>
</div>

</div>

<div class="controls">
<button class="print-btn" id="print">🖨️ Printen</button>
<button class="pdf-btn" id="pdf">📄 PDF Opslaan</button>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

/* ========== Datum standaard vandaag ========== */
document.getElementById("date-from").value =
new Date().toISOString().split("T")[0];

/* ========== Handtekening met herstel bij resize ========== */
const canvas=document.getElementById("signature-pad");
const ctx=canvas.getContext("2d");
let drawing=false;

function resizeCanvas(){
    // Sla huidige tekening op
    const tempImage = canvas.toDataURL();
    
    const ratio=window.devicePixelRatio||1;
    const rect=canvas.getBoundingClientRect();
    
    // Resize wist het canvas automatisch
    canvas.width=rect.width*ratio;
    canvas.height=120*ratio;
    canvas.style.width=rect.width+"px";
    canvas.style.height="120px";
    ctx.setTransform(ratio,0,0,ratio,0,0);

    // Zet de handtekening direct weer terug
    const img = new Image();
    img.onload = function() {
        ctx.drawImage(img, 0, 0, rect.width, 120);
    };
    img.src = tempImage;
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas(); // Eerste keer laden

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    return{
        x:p.clientX-rect.left,
        y:p.clientY-rect.top
    };
}

function start(e){
    drawing=true;
    const pos=getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);
}

function draw(e){
    if(!drawing)return;
    const pos=getPos(e);
    ctx.lineWidth=2;
    ctx.lineCap="round";
    ctx.strokeStyle="#000";
    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
    if(e.cancelable)e.preventDefault();
}

function stop(){drawing=false;}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",draw);
canvas.addEventListener("mouseleave",stop);
window.addEventListener("mouseup",stop);

canvas.addEventListener("touchstart",start,{passive:false});
canvas.addEventListener("touchmove",draw,{passive:false});
canvas.addEventListener("touchend",stop);

document.getElementById("clear-signature")
.addEventListener("click",()=>ctx.clearRect(0,0,canvas.width,canvas.height));

/* ========== Print ========== */
document.getElementById("print")
.addEventListener("click",()=>window.print());

/* ========== PDF ========== */
document.getElementById("pdf")
.addEventListener("click",()=>{
    if(typeof html2pdf==="undefined"){
        alert("PDF bibliotheek niet geladen.");
        return;
    }
    const element=document.getElementById("work-order");
    html2pdf().set({
        margin:0,
        filename:"werkbon_pixia.pdf",
        image:{type:"jpeg",quality:0.98},
        html2canvas:{scale:2,useCORS:true},
        jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
    }).from(element).save();
});

});
</script>

</body>
</html>
