<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werkbon - Pixia B.V.</title>
    <!-- html2pdf bibliotheek toegevoegd -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        :root {
            --pixia-purple: #6a2a8b;
            --field-height: 34px;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 10px;
            background-color: #f0f2f5;
        }

        .page {
            background: white;
            width: 210mm;
            margin: auto;
            padding: 20px 25px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .logo img { max-width: 180px; height: auto; }
        .company-info { text-align: right; font-size: 0.8em; color: #444; }

        h1 {
            color: var(--pixia-purple);
            border-bottom: 2px solid var(--pixia-purple);
            padding-bottom: 5px;
            margin: 0 0 15px 0;
            font-size: 1.4em;
        }

        .section { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.8em; color: var(--pixia-purple); text-transform: uppercase; }
        
        input, textarea, .editable-area {
            width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 4px;
            box-sizing: border-box; font-size: 14px; font-family: inherit;
        }

        .klant-input {
            height: 110px; 
            resize: none;
            overflow: hidden;
        }

        /* Dynamische velden voor werkzaamheden, materialen en opmerkingen */
        .editable-area { 
            min-height: 60px; 
            white-space: pre-wrap; 
            border: 1px solid #cbd5e0; 
            background: #fff;
        }

        .row { display: flex; gap: 20px; margin-bottom: 12px; }
        .col-compact { flex: 0 0 auto; }
        
        .approval-box {
            border: 2px solid var(--pixia-purple);
            padding: 15px;
            background-color: #fcfaff;
            margin-top: 10px;
            border-radius: 8px;
        }

        .signature-wrap { background: #fff; border: 1px solid #cbd5e0; margin-top: 10px; border-radius: 4px; }
        .signature-pad { width: 100%; height: 120px; display: block; touch-action: none; cursor: crosshair; }

        .controls { text-align: center; margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        button { padding: 12px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; border: none; }
        .btn-print { background-color: #4a5568; color: white; }
        .btn-pdf { background-color: var(--pixia-purple); color: white; }
        .btn-clear { background: #edf2f7; border: 1px solid #cbd5e0; font-size: 0.7em; padding: 4px 8px; float: right; cursor: pointer; }

        @media print {
            @page { margin: 0; size: A4; }
            body { background: white; padding: 0; margin: 0; }
            .controls, .btn-clear { display: none !important; }
            .page {
                box-shadow: none; margin: 0; width: 100%; height: auto;
                padding: 10mm; transform: scale(0.98); transform-origin: top center;
            }
        }
    </style>
</head>
<body>

    <div class="page" id="work-order">
        <div class="header">
            <div class="logo"><img src="https://www.sign.nl/wp-content/uploads/2025/01/PIXIA_logo_paars.jpg" alt="Logo"></div>
            <div class="company-info">
                <strong>Pixia B.V.</strong><br>De Limiet 19, 4131 NR Vianen<br>+31 (0) 30 – 303 99 00
            </div>
        </div>

        <h1>WERKBON</h1>

        <div class="section">
            <label>Klantgegevens (5 regels):</label>
            <textarea class="klant-input" placeholder="Naam&#10;Adres&#10;Postcode & Woonplaats&#10;Contactpersoon&#10;Telefoonnummer"></textarea>
        </div>

        <!-- NIEUW: Email adres veld -->
        <div class="section">
            <label>E-mailadres klant:</label>
            <input type="email" placeholder="klant@voorbeeld.nl">
        </div>

        <div class="row">
            <div class="col-compact"><label>Datum van:</label><input type="date"></div>
            <div class="col-compact"><label>Datum tot:</label><input type="date"></div>
            <div class="col-compact"><label>Aantal gewerkte uren:</label><input type="text" style="width: 180px;"></div>
        </div>

        <div class="section">
            <label>Omschrijving Werkzaamheden:</label>
            <div class="editable-area" contenteditable="true"></div>
        </div>

        <!-- NIEUW: Materialen / Kosten veld (Dynamisch) -->
        <div class="section">
            <label>Materialen / Overige kosten:</label>
            <div class="editable-area" contenteditable="true" style="min-height: 50px;"></div>
        </div>

        <!-- AANGEPAST: Opmerkingen veld nu dynamisch -->
        <div class="section">
            <label>Opmerkingen:</label>
            <div class="editable-area" contenteditable="true" style="min-height: 50px;"></div>
        </div>

        <div class="approval-box">
            <button class="btn-clear" onclick="clearSignature()">Wissen</button>
            <label>Goedkeuring klant:</label>
            <p style="font-size: 0.75em; margin: 2px 0 8px 0;">Klant gaat akkoord met de werkzaamheden.</p>

            <div class="row">
                <div class="col-compact"><label>Plaats:</label><input type="text" style="width: 200px;"></div>
                <div class="col-compact"><label>Datum:</label><input type="date"></div>
            </div>

            <div class="signature-wrap">
                <canvas id="signature-pad" class="signature-pad"></canvas>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-print" onclick="window.print()">🖨️ Printen</button>
        <button class="btn-pdf" onclick="generatePDF()">📄 PDF Opslaan</button>
    </div>

    <script>
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function setupCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 120;
        }

        window.onload = setupCanvas;
        window.onresize = setupCanvas;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) { 
            drawing = true; 
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }
        function stopDrawing() { drawing = false; }

        function draw(e) {
            if (!drawing) return;
            const pos = getPos(e);
            ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            if (e.cancelable) e.preventDefault();
        }

        canvas.addEventListener('mousedown', startDrawing);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', draw, {passive: false});

        function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function generatePDF() {
            const element = document.getElementById('work-order');
            const opt = {
                margin: 0,
                filename: 'werkbon_pixia.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
